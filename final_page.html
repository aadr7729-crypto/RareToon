    <style>
        /* --- CSS Variables --- */
        :root {
            --glass-bg: rgba(20, 10, 40, 0.85); /* Darker opacity for better contrast */
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f0f0f0;
            --text-secondary: #c0c0c0;
            --accent-color: #ff4e7a;
            --accent-hover: #ff2755;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --radius: 16px;
        }

        /* --- Base Styles --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', sans-serif;
            color: var(--text-main);
            background: #070313;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            overflow-x: hidden; 
        }
        
        /* --- Animated Background --- */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(to top, #1c052e, #070313); overflow: hidden;
        }
        #moon {
            position: absolute; top: 5vh; right: 10vw; width: 100px; height: 100px; border-radius: 50%;
            background: radial-gradient(circle, #f5f5f5, #d8d8d8);
            box-shadow: 0 0 20px 5px rgba(240, 240, 255, 0.6), inset 0 0 15px rgba(0,0,0,0.2);
            animation: shine 8s ease-in-out infinite;
        }
        #flare {
            position: absolute; top: 8vh; right: 12vw; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 224, 0.2) 0%, rgba(255, 255, 224, 0) 70%);
            border-radius: 50%; mix-blend-mode: color-dodge; transform-origin: center;
            animation: flare-animation 10s ease-out infinite; animation-delay: -2s;
        }
        /* Stars & Meteors styling remains same (omitted for brevity, assume present) */
        #stars, #stars2, #stars3 { position: absolute; left: 0; top: 0; width: 1px; height: 1px; background: transparent; animation: animStar 50s linear infinite; }
        #stars2 { animation-duration: 100s; } #stars3 { animation-duration: 150s; }
        
        @keyframes animStar { from { transform: translateY(0px); } to { transform: translateY(-2000px); } }
        @keyframes shine { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        @keyframes flare-animation { 0% { opacity: 0; } 50% { opacity: 0.5; } 100% { opacity: 0; } }

        /* --- Layout Wrapper (Centers Ads + Card) --- */
        .layout-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            z-index: 1;
        }

        /* --- Main Glass Card --- */
        .glass-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            padding: 2rem;
            text-align: center;
        }

        .card-header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: 1px; }
        
        /* --- UPDATED: Taller Iframe Container --- */
        .iframe-container { 
            position: relative;
            width: 100%; 
            
            /* CHANGE: Removed Aspect Ratio (16:9) */
            /* CHANGE: Added responsive height */
            height: 65vh;       /* Takes 65% of viewport height */
            min-height: 550px;  /* Minimum fixed height ensures buttons fit */
            
            border-radius: calc(var(--radius) / 2); 
            overflow: hidden; 
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2); 
        }
        
        .iframe-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }

        /* --- Footer & Buttons --- */
        .card-footer { margin-top: 2rem; }
        .action-button { 
            display: inline-block; background: linear-gradient(135deg, var(--accent-color), var(--accent-hover)); 
            color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 500; 
            box-shadow: 0 4px 15px rgba(255, 78, 122, 0.2); transition: transform 0.2s;
        }
        .action-button:hover { transform: translateY(-3px); }
        .notice { margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; }
        
        .ad-container { width: 100%; display: flex; justify-content: center; align-items: center; }

        @media (max-width: 768px) {
            .glass-card { padding: 1.5rem; }
            .card-header h1 { font-size: 1.5rem; }
            /* Mobile par height thodi adjust karein */
            .iframe-container { height: 70vh; min-height: 500px; } 
            #moon { width: 60px; height: 60px; }
            #flare { width: 200px; height: 200px; }
        }
    </style>
</head>
