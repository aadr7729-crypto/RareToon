    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --apple-bg: #000000;
            --apple-card: rgba(255, 255, 255, 0.04);
            --apple-border: rgba(255, 255, 255, 0.12);
            --apple-blue: #7B22FA;
            --apple-blue-dark: #5706c9;
            --apple-amber: #ff9f0a;
            --apple-text: #f5f5f7;
            --apple-muted: rgba(235, 235, 245, 0.45);
        }

        /* Theme Customizer Tokens */
        [data-theme="emerald"] {
            --apple-blue: #00e676;
            --apple-blue-dark: #00b050;
        }
        [data-theme="sapphire"] {
            --apple-blue: #00b0ff;
            --apple-blue-dark: #0080ff;
        }
        [data-theme="sakura"] {
            --apple-blue: #f472b6;
            --apple-blue-dark: #db2777;
        }
        [data-theme="violet"] {
            --apple-blue: #7B22FA;
            --apple-blue-dark: #5706c9;
        }

        html, body {
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, system-ui, sans-serif;
            background: var(--apple-bg);
            color: var(--apple-text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 70px 16px 20px;
            background-image:
                radial-gradient(ellipse 70% 50% at 20% 10%, rgba(10, 132, 255, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(255, 159, 10, 0.08) 0%, transparent 50%);
        }

        .container {
            position: relative; z-index: 2;
            width: 100%; max-width: 390px;
            background: var(--apple-card);
            backdrop-filter: blur(40px) saturate(190%);
            -webkit-backdrop-filter: blur(40px) saturate(190%);
            border: 1px solid var(--apple-border);
            border-radius: 24px;
            padding: 26px 22px 22px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), 0 20px 60px rgba(0, 0, 0, 0.9);
            animation: appleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes appleIn { from { opacity: 0; transform: scale(0.96) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* Step Header */
        .step-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .step-label {
            font-size: 0.64rem;
            font-weight: 700;
            color: var(--apple-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .step-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .sdot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            transition: all 0.35s ease;
        }
        .sdot.done { background: #30d158; box-shadow: 0 0 7px rgba(48,209,88,0.6); }
        .sdot.active { background: var(--apple-blue); width: 18px; border-radius: 4px; box-shadow: 0 0 10px rgba(10,132,255,0.6); }

        /* Progress bar */
        .prog-wrap {
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .prog-fill {
            height: 100%;
            border-radius: 99px;
            background: var(--apple-blue);
            width: 33%;
            transition: width 0.5s ease;
        }

        /* Icon */
        .icon-wrap {
            width: 62px; height: 62px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 132, 255, 0.08);
            border-radius: 50%;
            border: 1px solid rgba(10, 132, 255, 0.22);
            color: var(--apple-blue);
            box-shadow: 0 0 24px rgba(10, 132, 255, 0.2);
            animation: iconPulse 2.5s ease-in-out infinite;
        }
        .icon-wrap svg { width: 30px; height: 30px; }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(10,132,255,0.3); }
            50% { box-shadow: 0 0 0 12px rgba(10,132,255,0); }
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(10, 132, 255, 0.08);
            border: 1px solid rgba(10, 132, 255, 0.2);
            border-radius: 99px;
            color: var(--apple-blue);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            margin-bottom: 14px;
        }
        .badge-dot {
            width: 5px; height: 5px;
            background: var(--apple-blue);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--apple-blue);
            animation: blink 1.4s infinite;
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        h2 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .desc {
            font-size: 0.8rem;
            color: var(--apple-muted);
            line-height: 1.5;
            margin-bottom: 18px;
            font-weight: 400;
        }

        /* Notice */
        .notice {
            background: rgba(255, 159, 10, 0.08);
            border: 1px solid rgba(255, 159, 10, 0.2);
            color: #ffc069;
            font-size: 0.75rem;
            padding: 9px 13px;
            border-radius: 12px;
            margin-bottom: 18px;
            line-height: 1.4;
            text-align: center;
            font-weight: 500;
        }

        /* Timer bar */
        .timer-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 99px;
            margin-bottom: 18px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            background: var(--apple-blue);
            width: 0%;
            transition: width 5s linear;
            box-shadow: 0 0 10px var(--apple-blue);
        }

        /* CTA Button */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.94rem;
            text-decoration: none;
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.45;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.25s ease;
        }

        .btn.active {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
            background: linear-gradient(180deg, var(--apple-blue) 0%, var(--apple-blue-dark) 100%);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 24px var(--apple-blue), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .btn.active:hover { transform: translateY(-1px); box-shadow: 0 8px 30px var(--apple-blue); }
        .btn.active:active { transform: scale(0.98); }

        .footer-info {
            margin-top: 16px;
            font-size: 0.64rem;
            color: rgba(255,255,255,0.22);
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .container { padding: 22px 18px 18px; border-radius: 22px; }
            h2 { font-size: 1.22rem; }
            .icon-wrap { width: 54px; height: 54px; }
            .icon-wrap svg { width: 26px; height: 26px; }
            .btn { padding: 13px; font-size: 0.9rem; }
        }
        .rai-sticky-header { position: fixed; top: 0; left: 0; right: 0; width: 100%; z-index: 9999; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.12); padding: 10px 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 25px rgba(0,0,0,0.6); }
        .header-logo-link { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: transform 0.25s ease; }
        .header-logo-link:hover { transform: scale(1.04); }
        .header-logo-img { height: 38px; width: auto; max-width: 260px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(10, 132, 255, 0.5)); }
        .rai-footer { margin-top: 20px; margin-bottom: 12px; text-align: center; font-size: 0.88rem; color: #efdcff; letter-spacing: 0.02em; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 9px 20px; border-radius: 99px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
